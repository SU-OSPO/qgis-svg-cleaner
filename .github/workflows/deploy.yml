# Build the shinylive app and deploy to GitHub Pages.
name: Deploy shinylive app to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v5

      - uses: rstudio/shiny-workflows/setup-r-package@v1
        with:
          packages: |
            renv
            posit-dev/r-shinylive
            sessioninfo
          # Bump this string to invalidate the package cache
          cache-version: "1"

      - name: Find package dependencies
        shell: Rscript {0}
        run: |
          # Scan the repo for library()/require()/pkg::fn references and
          # install whatever is found
          pak::pak(unique(renv::dependencies(".")$Package))

      - name: Build site
        shell: Rscript {0}
        run: |
          shinylive::export("app", "site")

      - name: Upload site artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: "site"

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build

    # Grant GITHUB_TOKEN the permissions required for a Pages deployment
    permissions:
      pages: write       # to deploy to Pages
      id-token: write    # to verify the deployment source

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
